name: Collect ScanMalware IOCs

on:
  schedule:
    - cron: "0 * * * *"   # de hora a hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        id: collect
        run: python scripts/fetch_iocs.py | tee collector_output.txt

      - name: Extract new domains
        id: newdomains
        run: |
          NEW=$(grep '^NEW_DOMAINS=' collector_output.txt | cut -d= -f2-)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update IOCs $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "Sem alterações"
          fi

      - name: Notify Telegram
        if: steps.newdomains.outputs.new != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="Novos domínios Fake PDF Viewer / ScanMalware: ${{ steps.newdomains.outputs.new }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}"
